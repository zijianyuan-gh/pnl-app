# Daybook release pipeline (free GitHub features only):
#   test   → unit + Chromium/WebKit E2E on the exact /pnl-app/ build + release gate
#   pages  → publish that tested build to the gh-pages branch (GitHub Pages, HTTPS)
#   live   → wait until https://<owner>.github.io/<repo>/ serves THIS commit, then run the
#            live checks there (Chromium + WebKit), incl. "a redeploy keeps existing data"
#   mac    → build Daybook.app on macOS, test the real binary there, attach it to a release
#   ios    → build the native iOS app (Capacitor, web assets bundled), run XCUITests in the
#            iOS Simulator, export App Store screenshots, make an UNSIGNED device archive
#            (no signing, no upload — that needs the owner's Apple Developer account)
# Nothing is published unless `test` passes.
name: CI & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BASE_PATH: /${{ github.event.repository.name }}/

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check + unit tests
        run: npm run typecheck && npm test
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: E2E (Chromium + WebKit) on the published sub-path build
        run: npm run e2e
        env:
          CI: 'true'
          PW_WEBKIT: '1'
      - name: Build the site
        run: npm run build
      - name: Release gate — no test data, backups or secrets in the build
        run: npm run check:dist
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 7

  pages:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Published ${GITHUB_SHA} to gh-pages" >> "$GITHUB_STEP_SUMMARY"

  live:
    needs: pages
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LIVE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Wait until the live site serves this commit
        run: |
          for i in $(seq 1 60); do
            if curl -fsS -m 20 "$LIVE_URL?probe=$i" | grep -q "name=\"daybook-build\" content=\"${GITHUB_SHA}\""; then
              echo "### Live: $LIVE_URL (build ${GITHUB_SHA::7})" >> "$GITHUB_STEP_SUMMARY"; exit 0
            fi
            sleep 10
          done
          echo "::error::$LIVE_URL is not serving ${GITHUB_SHA} after 10 minutes (is GitHub Pages enabled for the gh-pages branch?)"
          exit 1
      - run: npx playwright install --with-deps chromium webkit
      - name: Restore the browser profile from the previous deployment
        uses: actions/cache@v4
        with:
          path: live-profile
          key: live-profile-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: live-profile-
      - name: Verify the real site (Chromium + WebKit)
        run: |
          set -o pipefail
          npm run e2e:live 2>&1 | tee live.log
        env:
          EXPECT_SHA: ${{ github.sha }}
      - name: Summary
        if: always()
        run: grep -E "REDEPLOY CHECK|passed|failed|flaky" live.log >> "$GITHUB_STEP_SUMMARY" || true

  mac:
    needs: test
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      BASE_PATH: /
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      - run: npm ci
      - name: Build the web app (root path) and check it
        run: npm run build && npm run check:dist
      - name: Build Daybook.app (universal, ad-hoc signed)
        run: |
          npm run build:mac
          lipo -archs release/Daybook.app/Contents/MacOS/daybook
          codesign -dv release/Daybook.app
      - run: npx playwright install chromium webkit
      - name: Test the real binary on macOS (Chromium + Safari's WebKit)
        run: npm run e2e:mac
        env:
          DAYBOOK_BIN: release/Daybook.app/Contents/MacOS/daybook
          PW_WEBKIT: '1'
      - name: Test the one-line installer and a real app launch
        run: |
          DAYBOOK_ZIP_URL="$PWD/release/Daybook-mac.zip" DAYBOOK_DEST="$RUNNER_TEMP/Applications" bash mac/install.sh
          for i in $(seq 1 30); do
            [ "$(curl -s -m 2 http://127.0.0.1:47823/__daybook)" = "daybook" ] && { echo "launched via LaunchServices: OK"; break; }
            sleep 1
          done
          [ "$(curl -s -m 2 http://127.0.0.1:47823/__daybook)" = "daybook" ]
          curl -fsS http://127.0.0.1:47823/ | grep -q 'Daybook — P&amp;L Journal'
          pkill -x daybook
      - uses: actions/upload-artifact@v4
        with:
          name: Daybook-mac
          path: release/Daybook-mac.zip
          retention-days: 14
      - name: Attach to the GitHub release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          gh release view "$v" >/dev/null 2>&1 || gh release create "$v" --target "$GITHUB_SHA" --title "Daybook ${v#v}" \
            --notes "Mac: download Daybook-mac.zip, or run in Terminal: curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/mac/install.sh | bash"
          gh release upload "$v" release/Daybook-mac.zip --clobber
          echo "### Mac app: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/Daybook-mac.zip" >> "$GITHUB_STEP_SUMMARY"

  ios:
    # builds and tests only (publishes no app), so it runs in parallel with "test"
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write # only to publish screenshots/logs to the ios-ci-output branch
    env:
      BASE_PATH: /
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Toolchain
        run: xcodebuild -version && xcrun simctl list runtimes | grep -i ios
      - name: Build the web app and bundle it into the iOS project
        run: |
          npm run build && npm run check:dist
          npx cap sync ios
          test -f ios/App/App/public/index.html
          # the app must load its bundled files, never a remote server
          ! grep -q '"url"' ios/App/App/capacitor.config.json
          grep -q 'connect-src' ios/App/App/public/index.html
      - name: Boot a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 scripts/ios-pick-simulator.py)
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          # Use the on-screen keyboard (as on an iPhone), so the UI tests can check Quick Add above it
          python3 - "$UDID" <<'PY'
          import plistlib, os, sys
          p = os.path.expanduser("~/Library/Preferences/com.apple.iphonesimulator.plist")
          d = plistlib.load(open(p, "rb")) if os.path.exists(p) else {}
          d["ConnectHardwareKeyboard"] = False
          d.setdefault("DevicePreferences", {}).setdefault(sys.argv[1], {})["ConnectHardwareKeyboard"] = False
          plistlib.dump(d, open(p, "wb"))
          PY
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          open -a Simulator --args -CurrentDeviceUDID "$UDID" || true
          sleep 5
          xcrun simctl status_bar "$UDID" override --time 9:41 --dataNetwork wifi --wifiBars 3 --cellularBars 4 --batteryState charged --batteryLevel 100
      - name: Build app + UI tests (simulator)
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO build-for-testing | tail -25
      - name: Prepare a synthetic PWA backup for the tests
        run: |
          node scripts/make-demo-backup.mjs build/demo
          echo "DEMO_BALANCE=$(node -p "require('./build/demo/expected.json').balance")" >> "$GITHUB_ENV"
      - name: Enroll Face ID; match a face only when a UI test asks
        run: |
          xcrun simctl spawn "$UDID" notifyutil -s com.apple.BiometricKit.enrollmentChanged '1'
          xcrun simctl spawn "$UDID" notifyutil -p com.apple.BiometricKit.enrollmentChanged
          # AppUITests.requestFaceIDMatch() drops a file here; each file = one "matching face"
          mkdir -p build/faceid build/ci-output
          echo "FACEID_DIR=$PWD/build/faceid" >> "$GITHUB_ENV"
          nohup bash -c 'while true; do
              for f in "$0"/match-*; do
                [ -e "$f" ] || continue
                rm -f "$f"
                xcrun simctl spawn "$1" notifyutil -p com.apple.BiometricKit_Sim.pearl.match
                echo "$(date +%T) face matched"
              done
              sleep 0.3
            done' "$PWD/build/faceid" "$UDID" > build/ci-output/faceid.log 2>&1 &
      - name: Run the UI tests in the Simulator
        env:
          TEST_RUNNER_DEMO_BALANCE: ${{ env.DEMO_BALANCE }}
          TEST_RUNNER_FACEID: '1'
          TEST_RUNNER_FACEID_DIR: ${{ env.FACEID_DIR }}
        run: |
          set -o pipefail
          # the Debug app copies this backup into its Documents folder (see DaybookViewController.seedForUITests)
          export TEST_RUNNER_DEMO_FILE="$PWD/build/demo/demo-backup.json"
          mkdir -p build/ci-output
          xcodebuild -project ios/App/App.xcodeproj -scheme App -destination "id=$UDID" -derivedDataPath build/dd \
            -resultBundlePath build/UITests.xcresult CODE_SIGNING_ALLOWED=NO test-without-building 2>&1 \
            | tee build/ci-output/xcodebuild-test.log \
            | grep -E "Test (Suite|Case)|error:|failed|passed|skipped|\*\* TEST" | tail -60
      - name: Export screenshots
        if: always()
        run: |
          mkdir -p build/screenshots build/ci-output
          xcrun xcresulttool export attachments --path build/UITests.xcresult --output-path build/screenshots || true
          ls -la build/screenshots | head -60
          DATA=$(xcrun simctl get_app_container "$UDID" io.github.zijianyuangh.daybook data 2>/dev/null || true)
          echo "DATA=$DATA" >> "$GITHUB_ENV"
          echo "--- app Documents after the tests:"; ls -la "$DATA/Documents" || true
          # app + web console log (Capacitor forwards console output in Debug builds)
          xcrun simctl spawn "$UDID" log show --last 30m --style compact --predicate 'process == "App"' > build/ci-output/app.log 2>&1 || true
          grep -E "Daybook" build/ci-output/app.log | grep -v XC_kAX | tail -20 || true
      - name: Publish screenshots and logs to the ios-ci-output branch (main only)
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=build/ci-output
          mkdir -p "$out"
          cp -R build/screenshots "$out/" 2>/dev/null || true
          (ls -la "$DATA/Documents" || true) > "$out/documents.txt"
          echo "${GITHUB_SHA}" > "$out/COMMIT"
          cd "$out"
          git init -q -b ios-ci-output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "iOS CI output for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ios-ci-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-ui-tests
          path: |
            build/screenshots
            build/UITests.xcresult
          retention-days: 14
      - name: Release archive for a real iPhone (unsigned — proves the device build compiles)
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Daybook.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive | tail -15
          APP=build/Daybook.xcarchive/Products/Applications/App.app
          test -f "$APP/public/index.html"
          lipo -archs "$APP/App"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' -c 'Print :CFBundleShortVersionString' -c 'Print :CFBundleVersion' "$APP/Info.plist"
          echo "### iOS: simulator UI tests passed; unsigned Release archive built ($(du -sh "$APP" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
