# Daybook web CI and deployment (runs on every code change to main and on pull requests):
#   test   → unit + Chromium/WebKit E2E on the exact /pnl-app/ build + release gate
#   pages  → publish that tested build to the gh-pages branch (GitHub Pages, HTTPS)
#   live   → wait until https://<owner>.github.io/<repo>/ serves THIS commit, then run the
#            live checks there (Chromium + WebKit), incl. "a redeploy keeps existing data"
# Nothing is published unless `test` passes. Changes that only touch documentation (*.md, docs/)
# do not run this workflow. The iOS simulator suite and the Mac app are checked by the separate
# "Release validation" workflow (.github/workflows/release-validation.yml).
name: CI & deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/release-validation.yml'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/release-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BASE_PATH: /${{ github.event.repository.name }}/

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check + unit tests
        run: npm run typecheck && npm test
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: E2E (Chromium + WebKit) on the published sub-path build
        run: npm run e2e
        env:
          CI: 'true'
          PW_WEBKIT: '1'
      - name: Build the site
        run: npm run build
      - name: Release gate — no test data, backups or secrets in the build
        run: npm run check:dist
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 7

  pages:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Published ${GITHUB_SHA} to gh-pages" >> "$GITHUB_STEP_SUMMARY"

  live:
    needs: pages
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LIVE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Wait until the live site serves this commit
        run: |
          for i in $(seq 1 60); do
            if curl -fsS -m 20 "$LIVE_URL?probe=$i" | grep -q "name=\"daybook-build\" content=\"${GITHUB_SHA}\""; then
              echo "### Live: $LIVE_URL (build ${GITHUB_SHA::7})" >> "$GITHUB_STEP_SUMMARY"; exit 0
            fi
            sleep 10
          done
          echo "::error::$LIVE_URL is not serving ${GITHUB_SHA} after 10 minutes (is GitHub Pages enabled for the gh-pages branch?)"
          exit 1
      - run: npx playwright install --with-deps chromium webkit
      - name: Restore the browser profile from the previous deployment
        uses: actions/cache@v4
        with:
          path: live-profile
          key: live-profile-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: live-profile-
      - name: Verify the real site (Chromium + WebKit)
        run: |
          set -o pipefail
          npm run e2e:live 2>&1 | tee live.log
        env:
          EXPECT_SHA: ${{ github.sha }}
      - name: Summary
        if: always()
        run: grep -E "REDEPLOY CHECK|passed|failed|flaky" live.log >> "$GITHUB_STEP_SUMMARY" || true
